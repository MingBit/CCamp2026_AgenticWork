[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrna-evidence-workflow"
version = "0.1.0"
description = "Local, auditable single-cell workflow with explicit scientific gates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "anndata>=0.10,<0.13", "scanpy>=1.10,<1.13", "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "networkx>=3,<4", "PyYAML>=6,<7", "igraph>=0.11,<2", "leidenalg>=0.10,<1"]

[project.optional-dependencies]
de = ["pydeseq2>=0.5,<0.6"]

[project.scripts]
scrna-workflow = "scrna_workflow.runner:main"

[tool.setuptools.packages.find]
include = ["scrna_workflow*"]
