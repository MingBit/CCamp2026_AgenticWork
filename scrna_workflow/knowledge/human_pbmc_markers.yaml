name: Human PBMC broad cell types
organism: human
tissue: peripheral blood mononuclear cells
source:
  - https://satijalab.org/seurat/articles/pbmc3k_tutorial
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC5775029/
markers:
  T cells: [CD3D, CD3E, IL7R, CCR7]
  B cells: [MS4A1, CD79A, CD79B]
  NK cells: [GNLY, NKG7, PRF1]
  CD14+ monocytes: [CD14, LYZ, S100A8, S100A9]
  FCGR3A+ monocytes: [FCGR3A, MS4A7, LST1]
  Dendritic cells: [FCER1A, CST3, CD1C, FLT3]
  Plasmacytoid dendritic cells: [CLEC4C, LILRA4, TCF4, PLD4]
  Platelets: [PPBP, PF4]
