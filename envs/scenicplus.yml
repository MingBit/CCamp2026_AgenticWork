# SCENIC+ environment (scenicplus v1.0a2 + pycisTopic + pycistarget), exported from the
# working "multiome" env on the analysis server (Linux x86_64). GitHub-installed packages
# are pinned to the commits recorded in scenicplus_pip_freeze.txt.
#
# Build (from the repo root), two steps:
#   PIP_CONSTRAINT="$PWD/envs/scenicplus-build-constraints.txt" \
#     conda env create -f envs/scenicplus.yml
#   conda run -n scenicplus python -m pip install --no-deps \
#     "scenicplus @ git+https://github.com/aertslab/scenicplus@86fa25e6819919e2a824c14f7fd0d6e01e257ae9"  # v1.0a2
#
# scenicplus is installed separately with --no-deps because its requirements point at
# unpinned GitHub URLs (e.g. LoomXpy@main), which pip refuses to reconcile with the
# commit-pinned pycisTopic/pycistarget/pySCENIC/LoomXpy below. All of its dependencies
# are already pinned in this file.
#
# Requires a system C/C++ compiler (GCC <= 13): datrie, annoy, pybedtools and MACS2
# are built from source by pip.
